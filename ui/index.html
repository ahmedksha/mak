<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAK VIBE CODING</title>
<style>
  /* Layout: a clear glass shell over one slow lava lamp. One muted ember accent, hairlines instead of fills. */
  :root {
    color-scheme: dark;
    --bg: #0c0c0e;
    --text: #ececee;
    --muted: #a9a9b2;
    --glass: rgba(255, 255, 255, 0.035);
    --glass-strong: rgba(255, 255, 255, 0.07);
    --glass-deep: rgba(0, 0, 0, 0.28);
    --line: rgba(255, 255, 255, 0.13);
    --line-soft: rgba(255, 255, 255, 0.08);
    --shine: rgba(255, 255, 255, 0.07);
    --shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    --accent: #e0a084;
    --accent-ink: #17100c;
    --ok: #9ad1b0;
    --warn: #d9c08a;
    --bad: #e3a0a0;
    --lava-hot: 214 132 100;
    --lava-cool: 150 150 162;
    --lava-opacity: 0.38;
    --radius: 20px;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f1efec;
      --text: #1b1a19;
      --muted: #5c5955;
      --glass: rgba(255, 255, 255, 0.3);
      --glass-strong: rgba(255, 255, 255, 0.55);
      --glass-deep: rgba(255, 255, 255, 0.5);
      --line: rgba(255, 255, 255, 0.85);
      --line-soft: rgba(27, 26, 25, 0.11);
      --shine: rgba(255, 255, 255, 0.9);
      --shadow: 0 20px 50px rgba(90, 70, 60, 0.1);
      --accent: #a94f35;
      --accent-ink: #ffffff;
      --ok: #2f7d57;
      --warn: #7d5f14;
      --bad: #a83c3c;
      --lava-hot: 232 170 145;
      --lava-cool: 196 192 188;
      --lava-opacity: 0.42;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    overflow: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }

  /* The lamp: drawn small on a canvas and scaled up, so the wax edges stay soft. */
  .backdrop { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
  .backdrop canvas { width: 100%; height: 100%; display: block; opacity: var(--lava-opacity); filter: blur(3px); }

  .glass {
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow), inset 0 1px 0 var(--shine);
    -webkit-backdrop-filter: blur(7px) saturate(115%);
    backdrop-filter: blur(7px) saturate(115%);
  }

  .app {
    position: relative; z-index: 1;
    height: 100dvh; display: grid; grid-template-columns: 280px minmax(0, 1fr);
    gap: 16px; padding: 16px;
  }

  /* Sidebar */
  .side { display: flex; flex-direction: column; gap: 20px; padding: 22px 20px; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark {
    width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
    font-weight: 500; font-size: 17px; border: 1px solid var(--line); color: var(--accent);
  }
  .brand b { display: block; font-size: 14px; font-weight: 600; letter-spacing: 0.14em; line-height: 1.2; }
  .brand span { color: var(--muted); font-size: 10.5px; letter-spacing: 0.26em; }
  .field { display: grid; gap: 7px; }
  .label { font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .path { font: 12.5px/1.45 var(--mono); word-break: break-all; }
  .control {
    width: 100%; padding: 8px 11px; border-radius: 10px;
    background: transparent; border: 1px solid var(--line-soft); transition: border-color 0.2s;
  }
  .control:hover, .control:focus { border-color: var(--line); }
  select.control { appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
  select.control option { background: var(--bg); color: var(--text); }
  .switch { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; }
  .track {
    flex: none; width: 36px; height: 20px; border-radius: 999px; margin-top: 3px;
    background: transparent; border: 1px solid var(--line); position: relative; transition: background 0.2s, border-color 0.2s;
  }
  .track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--muted); transition: transform 0.2s, background 0.2s;
  }
  .switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(16px); background: var(--accent-ink); }
  .switch input:focus-visible + .track { outline: 1.5px solid var(--accent); outline-offset: 2px; }
  .switch small, .hint { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
  .todos { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .todos li { display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; line-height: 1.4; }
  .todos li.completed { color: var(--muted); }
  .box { flex: none; width: 14px; height: 14px; margin-top: 3px; border-radius: 50%; border: 1px solid var(--muted); display: grid; place-items: center; font-size: 9px; line-height: 1; }
  .in_progress .box { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 36%, transparent 42%); }
  .completed .box { border-color: var(--muted); color: var(--muted); }
  .cost { font: 12px/1.6 var(--mono); color: var(--muted); white-space: pre-line; }
  .side .spacer { flex: 1; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    padding: 7px 13px; border-radius: 10px; cursor: pointer;
    background: transparent; border: 1px solid var(--line-soft); font-size: 13.5px;
    transition: border-color 0.2s, background 0.2s;
  }
  .btn:hover { border-color: var(--line); background: var(--glass-strong); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { background: var(--accent); filter: brightness(1.08); }
  .btn.danger { color: var(--bad); }

  /* Main column */
  .main { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-bottom: 1px solid var(--line-soft); }
  .top h1 { margin: 0; font-size: 14px; font-weight: 500; letter-spacing: 0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .status i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .busy .status i { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  .menu { display: none; }

  .log { flex: 1; overflow-y: auto; padding: 26px 22px 8px; }
  .thread { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .welcome { text-align: center; padding: 12vh 0 3vh; }
  .welcome h2 { margin: 0 0 14px; font-size: clamp(22px, 3.4vw, 32px); letter-spacing: 0.22em; line-height: 1.2; font-weight: 300; text-wrap: balance; }
  .welcome p { margin: 0 auto 26px; color: var(--muted); max-width: 44ch; }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  .msg { white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { justify-self: end; max-width: 82%; padding: 9px 15px; border-radius: 16px 16px 4px 16px; background: var(--glass-strong); border: 1px solid var(--line-soft); }
  .answer { padding: 2px 2px; }
  .answer code, .card code { font: 13px var(--mono); border: 1px solid var(--line-soft); padding: 1px 6px; border-radius: 6px; }
  pre.code { margin: 8px 0; padding: 12px 14px; border-radius: 12px; background: var(--glass-deep); border: 1px solid var(--line-soft); overflow-x: auto; font: 13px/1.55 var(--mono); white-space: pre; }
  pre.code code { border: 0; padding: 0; }
  .think { color: var(--muted); font-size: 13.5px; }
  .think summary { cursor: pointer; width: fit-content; }
  .think div { white-space: pre-wrap; padding: 6px 0 0 14px; border-left: 1px solid var(--line-soft); margin-top: 6px; font-style: italic; }

  .card { padding: 11px 14px; border-radius: 14px; border: 1px solid var(--line-soft); display: grid; gap: 9px; }
  .card.sub { margin-left: 26px; }
  .head { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); align-self: center; }
  .card.running .dot { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  .card.error .dot, .card.denied .dot { background: var(--bad); }
  @keyframes pulse { 50% { opacity: 0.25; } }
  .head b { flex: none; font-weight: 500; }
  .head .what { font: 12.5px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head .tag { margin-left: auto; flex: none; font-size: 12px; color: var(--muted); }
  .card.error .tag, .card.denied .tag { color: var(--bad); }
  .diff { margin: 0; border-radius: 10px; overflow-x: auto; background: var(--glass-deep); border: 1px solid var(--line-soft); font: 12.5px/1.6 var(--mono); padding: 8px 0; }
  .diff span { display: block; padding: 0 12px; white-space: pre; }
  .diff .del { color: var(--bad); }
  .diff .add { color: var(--ok); }
  .out summary { cursor: pointer; color: var(--muted); font-size: 12.5px; width: fit-content; }
  .out pre { margin: 8px 0 0; max-height: 280px; overflow: auto; font: 12.5px/1.55 var(--mono); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .ask { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-top: 2px; }
  .ask span { color: var(--text); font-size: 13.5px; margin-right: 4px; }

  .notice { justify-self: center; font-size: 12.5px; color: var(--muted); padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line-soft); }
  .notice.warn { color: var(--warn); }
  .notice.error { color: var(--bad); }
  .notice.say { justify-self: stretch; border-radius: 12px; white-space: pre-wrap; font: 12.5px/1.6 var(--mono); padding: 12px 14px; }
  .dots { display: flex; gap: 5px; padding: 6px 2px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: pulse 1.4s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: 0.2s; } .dots i:nth-child(3) { animation-delay: 0.4s; }
  @media (prefers-reduced-motion: reduce) { .dots i, .dot, .status i { animation: none !important; } }

  /* Composer */
  .composer-wrap { padding: 10px 22px 18px; }
  .composer { max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px; padding: 7px 7px 7px 18px; border-radius: 18px; box-shadow: inset 0 1px 0 var(--shine); }
  .composer:focus-within { border-color: var(--accent); }
  .composer textarea { flex: 1; resize: none; border: 0; background: none; outline: none; padding: 8px 0; max-height: 180px; line-height: 1.5; }
  .composer textarea::placeholder { color: var(--muted); }
  .send { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); cursor: pointer; display: grid; place-items: center; background: transparent; color: var(--text); font-size: 16px; flex: none; transition: background 0.2s, color 0.2s, border-color 0.2s; }
  .send:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .busy .send { color: var(--bad); }
  .foot { max-width: 760px; margin: 8px auto 0; text-align: center; color: var(--muted); font-size: 11.5px; }
  kbd { font: 11px var(--mono); padding: 1px 5px; border-radius: 5px; border: 1px solid var(--line-soft); }

  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); padding: 10px; gap: 10px; }
    .menu { display: inline-grid; }
    .side { position: fixed; z-index: 5; inset: 10px 10px 10px 10px; display: none; }
    .side.open { display: flex; background: color-mix(in srgb, var(--bg) 78%, transparent); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); }
    .top { padding: 12px 14px; }
    .log { padding: 18px 14px 6px; }
    .composer-wrap { padding: 8px 12px 14px; }
    .user { max-width: 92%; }
    .foot { display: none; }
  }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><canvas id="lava"></canvas></div>

<div class="app" id="app">
  <aside class="side glass" id="side" aria-label="Impostazioni">
    <div class="brand">
      <div class="mark" aria-hidden="true">M</div>
      <div><b>MAK</b><span>VIBE CODING</span></div>
      <button class="btn menu" id="close" style="margin-left:auto" aria-label="Chiudi impostazioni">✕</button>
    </div>
    <div class="field"><span class="label">Progetto</span><span class="path" id="root">…</span></div>
    <label class="field"><span class="label">Modello</span>
      <input class="control" id="model" list="models" spellcheck="false" autocomplete="off">
      <datalist id="models"><option value="claude-opus-5-5"><option value="claude-sonnet-5-5"><option value="claude-haiku-5-5"><option value="claude-fable-5-2"></datalist>
    </label>
    <label class="field"><span class="label">Impegno</span>
      <select class="control" id="effort">
        <option value="low">Basso · veloce</option><option value="medium">Medio</option><option value="high">Alto</option>
        <option value="xhigh">Molto alto</option><option value="max">Massimo · lento</option>
      </select>
    </label>
    <label class="switch">
      <input type="checkbox" id="yolo"><span class="track"></span>
      <span>Approva tutto da solo<small>Modifiche e comandi partono senza chiederti conferma.</small></span>
    </label>
    <div class="field"><span class="label">Attività</span>
      <ul class="todos" id="todos"></ul><span class="hint" id="notodos">Qui vedrai i passi del lavoro in corso.</span>
    </div>
    <div class="spacer"></div>
    <div class="field"><span class="label">Sessione</span><span class="cost" id="cost"></span></div>
    <div class="row">
      <button class="btn" id="new">Nuova conversazione</button>
      <button class="btn" id="compact" title="Sostituisce la cronologia con un riassunto">Riassumi</button>
    </div>
  </aside>

  <main class="main glass">
    <header class="top">
      <button class="btn menu" id="open" aria-label="Apri impostazioni">☰</button>
      <h1 id="title">MAK VIBE CODING</h1>
      <div class="status" role="status"><i></i><span id="status">Pronto</span></div>
    </header>
    <div class="log" id="log">
      <div class="thread" id="thread" aria-live="polite"></div>
    </div>
    <div class="composer-wrap">
      <form class="composer glass" id="form">
        <textarea id="input" rows="1" placeholder="Chiedi qualcosa sul tuo codice…" aria-label="Messaggio"></textarea>
        <button class="send" id="send" aria-label="Invia">↑</button>
      </form>
      <div class="foot"><kbd>Invio</kbd> invia · <kbd>Maiusc</kbd>+<kbd>Invio</kbd> va a capo · <kbd>/help</kbd> mostra i comandi</div>
    </div>
  </main>
</div>

<script nonce="__NONCE__">
(() => {
  const TOKEN = "__TOKEN__";
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  const LABELS = {
    read_file: "Lettura", write_file: "Nuovo file", edit_file: "Modifica", bash: "Comando", glob: "Ricerca file",
    grep: "Ricerca nel codice", todo_write: "Attività", task: "Sotto-agente", web_search: "Ricerca web", web_fetch: "Pagina web",
  };
  const thread = $("thread"), log = $("log"), input = $("input"), app = $("app");
  const cards = new Map();
  let busy = false, answer = null, think = null, waiting = null;

  const post = (path, body) =>
    fetch(path, { method: "POST", headers: { "content-type": "application/json", "x-mak-token": TOKEN }, body: JSON.stringify(body || {}) });
  const send = async (text, silent) => {
    const res = await post("/api/input", { text, silent: !!silent });
    if (res.status === 409) note("warn", "Aspetta la fine della risposta, oppure fermala.");
    return res.ok;
  };

  const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 140;
  const add = (node) => {
    const stick = nearBottom();
    if (waiting) thread.insertBefore(node, waiting); else thread.append(node);
    if (stick) log.scrollTop = log.scrollHeight;
    return node;
  };
  const follow = (fn) => { const stick = nearBottom(); fn(); if (stick) log.scrollTop = log.scrollHeight; };
  const note = (level, text) => add(el("div", "notice " + level, text));

  // Minimal Markdown: fenced code, inline code and bold. Everything is escaped first.
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = (s) => esc(s).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  const markdown = (src) => {
    const parts = src.split("```");
    return parts.map((part, i) => {
      // Blank lines next to a code block would double its margins.
      if (i % 2 === 0) return inline(part.replace(i ? /^\n+/ : /^$/, "").replace(i < parts.length - 1 ? /\n+$/ : /^$/, ""));
      const body = part.replace(/^[^\n]*\n?/, "");
      return '<pre class="code"><code>' + esc(body.replace(/\n$/, "")) + "</code></pre>";
    }).join("");
  };

  function welcome() {
    const box = el("div", "welcome");
    box.append(el("h2", "", "MAK VIBE CODING"), el("p", "", "Descrivi cosa vuoi ottenere: leggo il codice, propongo le modifiche e le eseguo solo con il tuo via libera."));
    const chips = el("div", "chips");
    for (const text of ["Spiegami questo progetto", "Trova e correggi un bug", "Scrivi i test che mancano"]) {
      const chip = el("button", "btn", text);
      chip.type = "button";
      chip.addEventListener("click", () => { input.value = text; grow(); input.focus(); });
      chips.append(chip);
    }
    box.append(chips);
    thread.append(box);
  }
  const clearWelcome = () => thread.querySelector(".welcome")?.remove();

  function renderTodos(todos) {
    const list = $("todos");
    list.replaceChildren();
    for (const t of todos) {
      const li = el("li", t.status);
      li.append(el("span", "box", t.status === "completed" ? "✓" : ""), el("span", "", t.content));
      list.append(li);
    }
    $("notodos").hidden = todos.length > 0;
  }

  function toolStart(e) {
    answer = think = null;
    const card = el("div", "card running" + (e.sub ? " sub" : ""));
    const head = el("div", "head");
    const what = el("span", "what", e.summary);
    what.title = e.summary;
    head.append(el("span", "dot"), el("b", "", LABELS[e.name] || e.name), what, el("span", "tag", "in corso"));
    card.append(head);
    if (e.detail) {
      const diff = el("pre", "diff");
      for (const line of e.detail.split("\n")) {
        const text = line.replace(/^ {4}/, "");
        diff.append(el("span", text.startsWith("-") ? "del" : "add", text));
      }
      card.append(diff);
    }
    if (e.todos) {
      renderTodos(e.todos);
      const list = el("ul", "todos");
      for (const t of e.todos) {
        const li = el("li", t.status);
        li.append(el("span", "box", t.status === "completed" ? "✓" : ""), el("span", "", t.content));
        list.append(li);
      }
      card.append(list);
    }
    cards.set(e.id, card);
    add(card);
  }

  function toolEnd(e) {
    const card = cards.get(e.id);
    if (!card) return;
    follow(() => {
      card.classList.remove("running");
      card.querySelector(".ask")?.remove();
      const tag = card.querySelector(".tag");
      if (e.status === "denied") { card.classList.add("denied"); tag.textContent = "negato"; return; }
      if (e.status === "error") card.classList.add("error");
      tag.textContent = e.status === "error" ? "errore" : "fatto";
      // A change already shows its diff; only failures need the raw result too.
      if (e.server || card.querySelector(".todos") || !e.output.trim()) return;
      if (card.querySelector(".diff") && e.status === "ok") return;
      const lines = e.output.trimEnd().split("\n");
      const out = el("details", "out");
      out.open = e.status === "error" || lines.length <= 4;
      out.append(el("summary", "", lines.length === 1 ? "Risultato" : "Risultato · " + lines.length + " righe"), el("pre", "", e.output.trimEnd()));
      card.append(out);
    });
  }

  function approval(e) {
    const card = cards.get(e.id);
    if (!card || card.querySelector(".ask")) return;
    const bar = el("div", "ask");
    bar.append(el("span", "", "Posso procedere?"));
    for (const [value, text, cls] of [["yes", "Consenti", "btn primary"], ["always", "Consenti sempre", "btn"], ["no", "Nega", "btn danger"]]) {
      const b = el("button", cls, text);
      b.type = "button";
      b.addEventListener("click", () => { bar.querySelectorAll("button").forEach((x) => (x.disabled = true)); post("/api/approve", { id: e.id, answer: value }); });
      bar.append(b);
    }
    follow(() => { card.querySelector(".tag").textContent = "in attesa"; card.append(bar); });
    bar.querySelector("button").focus({ preventScroll: true });
  }

  function setBusy(value) {
    busy = value;
    app.classList.toggle("busy", busy);
    $("status").textContent = busy ? "Al lavoro…" : "Pronto";
    $("send").textContent = busy ? "■" : "↑";
    $("send").setAttribute("aria-label", busy ? "Ferma" : "Invia");
    if (busy && !waiting) { waiting = el("div", "dots"); waiting.append(el("i"), el("i"), el("i")); thread.append(waiting); log.scrollTop = log.scrollHeight; }
    if (!busy && waiting) { waiting.remove(); waiting = null; }
  }

  const handlers = {
    reset() { thread.replaceChildren(); cards.clear(); answer = think = waiting = null; renderTodos([]); welcome(); },
    user(e) { clearWelcome(); answer = think = null; add(el("div", "msg user", e.text)); log.scrollTop = log.scrollHeight; },
    thinking(e) {
      if (!think) {
        const box = el("details", "think");
        box.append(el("summary", "", "Ragionamento"), (think = el("div", "")));
        add(box); answer = null;
      }
      follow(() => (think.textContent += e.delta));
    },
    text(e) {
      clearWelcome();
      if (!answer) { answer = add(el("div", "msg answer")); answer.raw = ""; think = null; }
      follow(() => { answer.raw += e.delta; answer.innerHTML = markdown(answer.raw); });
    },
    message_end() { answer = think = null; },
    tool_start(e) { clearWelcome(); toolStart(e); },
    tool_end: toolEnd,
    approval,
    approval_done() {},
    notice(e) { clearWelcome(); answer = think = null; note(e.level, e.text.trim()); },
    state(e) {
      $("root").textContent = e.root;
      $("title").textContent = e.root.split(/[\\/]/).filter(Boolean).pop() || e.name;
      if (document.activeElement !== $("model")) $("model").value = e.model;
      $("effort").value = e.effort;
      $("yolo").checked = e.yolo;
      $("cost").textContent = e.cost.replace(/ · /g, "\n").replace("Token: ", "");
      setBusy(e.busy);
    },
  };

  const source = new EventSource("/events?t=" + TOKEN);
  source.onmessage = (m) => { const e = JSON.parse(m.data); handlers[e.type]?.(e); };
  source.onerror = () => { $("status").textContent = "Disconnesso"; };

  const grow = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; };
  input.addEventListener("input", grow);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
  });
  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (busy) return void post("/api/interrupt");
    const text = input.value.trim();
    if (!text) return;
    input.value = ""; grow();
    if (!(await send(text))) { input.value = text; grow(); }
  });
  $("model").addEventListener("change", (e) => e.target.value.trim() && send("/model " + e.target.value.trim(), true));
  $("effort").addEventListener("change", (e) => send("/effort " + e.target.value, true));
  $("yolo").addEventListener("change", (e) => send("/yolo " + (e.target.checked ? "on" : "off"), true));
  $("new").addEventListener("click", () => send("/clear", true));
  $("compact").addEventListener("click", () => send("/compact", true));
  $("open").addEventListener("click", () => $("side").classList.add("open"));
  $("close").addEventListener("click", () => $("side").classList.remove("open"));

  // Lava lamp: a metaball field on a small canvas. Wax rises warm from the pool at the
  // bottom, cools as it climbs, and sinks back. Colours come from the theme tokens.
  (() => {
    const canvas = $("lava"), ctx = canvas.getContext("2d");
    const still = matchMedia("(prefers-reduced-motion: reduce)");
    const rand = (a, b) => a + Math.random() * (b - a);
    const drops = Array.from({ length: 9 }, (_, i) => ({
      x: (i + 0.5) / 9 + rand(-0.04, 0.04), r: rand(0.075, 0.13), period: rand(70, 150), phase: Math.random(), sway: rand(0, 6.28),
    }));
    const pools = [[0.1, 1.12, 0.2], [0.36, 1.16, 0.24], [0.62, 1.13, 0.22], [0.88, 1.15, 0.23], [0.28, -0.14, 0.17], [0.72, -0.16, 0.19]];
    let w = 0, h = 0, image = null, hot = [0, 0, 0], cool = [0, 0, 0], last = 0;

    const readTheme = () => {
      const css = getComputedStyle(document.documentElement);
      hot = css.getPropertyValue("--lava-hot").trim().split(/\s+/).map(Number);
      cool = css.getPropertyValue("--lava-cool").trim().split(/\s+/).map(Number);
    };
    const resize = () => {
      const scale = Math.max(6, Math.ceil(innerWidth / 170));
      w = canvas.width = Math.max(40, Math.ceil(innerWidth / scale));
      h = canvas.height = Math.max(40, Math.ceil(innerHeight / scale));
      image = ctx.createImageData(w, h);
    };
    const draw = (seconds) => {
      const unit = Math.min(w, h), ratio = w / h, balls = [];
      for (const d of drops) {
        const turn = (seconds / d.period + d.phase) * 6.2832;
        balls.push([(d.x + 0.05 * Math.sin(seconds / 23 + d.sway)) * w, (0.5 + 0.66 * Math.sin(turn)) * h, d.r * unit]);
      }
      for (const [x, y, r] of pools) balls.push([x * w, y * h + Math.sin(seconds / 31 + x * 9) * 0.02 * h, r * unit * Math.max(1, ratio * 0.55)]);
      const data = image.data;
      for (let py = 0, i = 0; py < h; py++) {
        const warm = py / h, red = cool[0] + (hot[0] - cool[0]) * warm, green = cool[1] + (hot[1] - cool[1]) * warm, blue = cool[2] + (hot[2] - cool[2]) * warm;
        for (let px = 0; px < w; px++, i += 4) {
          let field = 0;
          for (let b = 0; b < balls.length; b++) {
            const dx = px - balls[b][0], dy = py - balls[b][1];
            const near = (balls[b][2] * balls[b][2]) / (dx * dx + dy * dy + 0.01);
            field += near * near; // steep falloff keeps separate drops separate until they touch
          }
          const edge = field < 0.8 ? 0 : field > 1.25 ? 1 : (field - 0.8) / 0.45;
          data[i] = red; data[i + 1] = green; data[i + 2] = blue;
          data[i + 3] = 255 * edge * edge * (3 - 2 * edge);
        }
      }
      ctx.putImageData(image, 0, 0);
    };
    const frame = (now) => {
      if (!document.hidden && now - last > 40) { last = now; draw(now / 1000); }
      if (!still.matches) requestAnimationFrame(frame);
    };
    const restart = () => { readTheme(); resize(); draw(performance.now() / 1000); };
    addEventListener("resize", restart);
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", restart);
    new MutationObserver(restart).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    still.addEventListener("change", () => !still.matches && requestAnimationFrame(frame));
    restart();
    if (!still.matches) requestAnimationFrame(frame);
  })();

  welcome();
  input.focus();
})();
</script>
</body>
</html>
