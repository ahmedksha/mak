<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAK VIBE CODING</title>
<style>
  /* Layout: one tall glass vessel in the middle of a lava lamp. The lamp is the status light:
     calm when idle, hotter while the agent works, almost still while it waits for an answer. */
  :root {
    color-scheme: dark;
    --bg: #0c0c0e;
    --text: #ececee;
    --muted: #a9a9b2;
    --glass: rgba(255, 255, 255, 0.035);
    --glass-strong: rgba(255, 255, 255, 0.075);
    --glass-deep: rgba(0, 0, 0, 0.28);
    --sheet: rgba(22, 22, 26, 0.82);
    --line: rgba(255, 255, 255, 0.13);
    --line-soft: rgba(255, 255, 255, 0.08);
    --shine: rgba(255, 255, 255, 0.07);
    --shadow: 0 24px 60px rgba(0, 0, 0, 0.32);
    --accent: #e0a084;
    --accent-ink: #17100c;
    --ok: #9ad1b0;
    --warn: #d9c08a;
    --bad: #e3a0a0;
    --lava-hot: 214 132 100;
    --lava-cool: 150 150 162;
    --lava-opacity: 0.4;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f1efec;
      --text: #1b1a19;
      --muted: #5c5955;
      --glass: rgba(255, 255, 255, 0.3);
      --glass-strong: rgba(255, 255, 255, 0.6);
      --glass-deep: rgba(255, 255, 255, 0.5);
      --sheet: rgba(250, 249, 247, 0.9);
      --line: rgba(255, 255, 255, 0.85);
      --line-soft: rgba(27, 26, 25, 0.11);
      --shine: rgba(255, 255, 255, 0.9);
      --shadow: 0 24px 60px rgba(90, 70, 60, 0.12);
      --accent: #a94f35;
      --accent-ink: #ffffff;
      --ok: #2f7d57;
      --warn: #7d5f14;
      --bad: #a83c3c;
      --lava-hot: 232 170 145;
      --lava-cool: 196 192 188;
      --lava-opacity: 0.45;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    overflow: hidden;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }

  .backdrop { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
  .backdrop canvas { width: 100%; height: 100%; display: block; opacity: var(--lava-opacity); filter: blur(3px); transition: opacity 1.6s ease; }

  .glass {
    background: var(--glass);
    border: 1px solid var(--line);
    box-shadow: var(--shadow), inset 0 1px 0 var(--shine);
    -webkit-backdrop-filter: blur(7px) saturate(115%);
    backdrop-filter: blur(7px) saturate(115%);
  }

  .app {
    position: relative; z-index: 1;
    height: 100dvh; display: grid; grid-template-columns: minmax(0, 760px); justify-content: center;
    padding: 16px;
  }
  .lamp { position: relative; display: flex; flex-direction: column; min-height: 0; border-radius: 36px; overflow: hidden; }

  /* Top */
  .top { display: flex; align-items: center; gap: 12px; padding: 18px 22px 10px 26px; }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; letter-spacing: 0.22em; }
  .brand svg { width: 15px; height: 20px; fill: var(--accent); }
  .where { color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .where::before { content: "·"; margin-right: 12px; }
  .push { margin-left: auto; }
  .btn {
    padding: 7px 15px; border-radius: 999px; background: transparent; border: 1px solid var(--line-soft);
    font-size: 14px; white-space: nowrap; transition: border-color 0.2s, background 0.2s;
  }
  .btn:hover { border-color: var(--line); background: var(--glass-strong); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .link { background: none; border: 0; padding: 0; color: var(--muted); font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; justify-self: start; }
  .link:hover { color: var(--text); }

  /* Options sheet */
  .options {
    position: absolute; z-index: 4; top: 62px; right: 18px; width: min(330px, calc(100% - 36px));
    max-height: calc(100% - 80px); overflow-y: auto;
    display: grid; gap: 20px; padding: 22px; border-radius: 24px; background: var(--sheet);
    -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
  }
  .field { display: grid; gap: 9px; }
  .label { font-size: 13.5px; font-weight: 600; }
  .hint { color: var(--muted); font-size: 13.5px; line-height: 1.45; }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; border: 1px solid var(--line-soft); }
  .seg button { border: 0; background: none; padding: 6px 4px; border-radius: 999px; font-size: 13.5px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .switch { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; }
  .track { flex: none; width: 38px; height: 22px; border-radius: 999px; margin-top: 2px; border: 1px solid var(--line); position: relative; transition: background 0.2s, border-color 0.2s; }
  .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform 0.2s, background 0.2s; }
  .switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(16px); background: var(--accent-ink); }
  .switch input:focus-visible + .track { outline: 1.5px solid var(--accent); outline-offset: 2px; }
  .switch small { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.45; font-weight: 400; }
  .spend { font-size: 22px; font-weight: 300; font-variant-numeric: tabular-nums; }
  .adv summary { cursor: pointer; color: var(--muted); font-size: 13.5px; width: fit-content; }
  .adv > div { display: grid; gap: 14px; padding-top: 14px; }
  .control { width: 100%; padding: 8px 12px; border-radius: 12px; background: transparent; border: 1px solid var(--line-soft); font-size: 14px; }
  .tokens { font: 12px/1.6 var(--mono); color: var(--muted); white-space: pre-line; word-break: break-all; }

  /* Conversation */
  .log { flex: 1; overflow-y: auto; padding: 14px 26px 8px; }
  .thread { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .welcome { padding: 14vh 0 2vh; }
  .welcome h2 { margin: 0 0 12px; font-size: clamp(28px, 5vw, 42px); font-weight: 300; letter-spacing: -0.01em; line-height: 1.15; text-wrap: balance; }
  .welcome p { margin: 0 0 26px; color: var(--muted); max-width: 40ch; }
  .ideas { display: grid; gap: 4px; justify-items: start; }
  .ideas button { background: none; border: 0; padding: 6px 0; text-align: left; border-bottom: 1px solid var(--line-soft); }
  .ideas button::after { content: " →"; color: var(--accent); }
  .ideas button:hover { border-color: var(--accent); }

  .msg { white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { justify-self: end; max-width: 84%; padding: 10px 18px; border-radius: 22px 22px 6px 22px; background: var(--glass-strong); border: 1px solid var(--line-soft); }
  .answer code, .step code { font: 0.86em var(--mono); border: 1px solid var(--line-soft); padding: 1px 6px; border-radius: 6px; }
  pre.code, pre.raw { margin: 8px 0; padding: 12px 14px; border-radius: 14px; background: var(--glass-deep); border: 1px solid var(--line-soft); overflow-x: auto; font: 13px/1.55 var(--mono); }
  pre.code { white-space: pre; }
  pre.raw { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow-y: auto; color: var(--muted); margin: 8px 0 0; }
  pre.code code { border: 0; padding: 0; font-size: inherit; }
  .think { color: var(--muted); font-size: 14px; }
  .think summary { cursor: pointer; width: fit-content; }
  .think div { white-space: pre-wrap; padding: 6px 0 0 14px; border-left: 1px solid var(--line-soft); margin-top: 6px; font-style: italic; }

  /* What the agent is doing: one plain sentence per action */
  .step { display: grid; gap: 6px; font-size: 15px; color: var(--muted); }
  .step.sub { margin-left: 24px; }
  .step .line { display: flex; gap: 11px; align-items: baseline; }
  .step b { font-weight: 500; color: var(--text); }
  .glyph { flex: none; width: 14px; text-align: center; font-size: 12px; }
  .step.running .glyph::before { content: "●"; color: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  .step.done .glyph::before { content: "✓"; }
  .step.denied .glyph::before { content: "–"; }
  .step.error .glyph::before { content: "!"; color: var(--bad); font-weight: 700; }
  .step.error .label { color: var(--bad); }
  @keyframes pulse { 50% { opacity: 0.25; } }
  .step details { margin-left: 25px; }
  .step summary { cursor: pointer; font-size: 13px; width: fit-content; opacity: 0.8; }
  .change { margin: 8px 0 0; border-radius: 14px; overflow-x: auto; background: var(--glass-deep); border: 1px solid var(--line-soft); font: 13px/1.6 var(--mono); padding: 8px 0; }
  .change span { display: block; padding: 0 14px; white-space: pre; }
  .change .del { color: var(--bad); }
  .change .add { color: var(--ok); }

  /* A question that needs the person's answer */
  .ask { margin: 4px 0 4px 25px; padding: 18px 20px; border-radius: 22px; display: grid; gap: 12px; background: var(--glass-strong); border: 1px solid var(--line); color: var(--text); }
  .ask h3 { margin: 0; font-size: 17px; font-weight: 500; text-wrap: balance; }
  .ask .change, .ask pre.raw { margin: 0; color: inherit; }
  .ask .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  .plan { padding: 2px 0 2px 25px; display: grid; gap: 7px; font-size: 15px; }
  .plan span { display: flex; gap: 10px; align-items: baseline; }
  .plan span::before { content: "○"; font-size: 11px; color: var(--muted); }
  .plan .in_progress::before { content: "●"; color: var(--accent); }
  .plan .completed { color: var(--muted); }
  .plan .completed::before { content: "✓"; }

  .notice { justify-self: center; font-size: 13.5px; color: var(--muted); padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line-soft); }
  .notice.warn { color: var(--warn); }
  .notice.error { color: var(--bad); border-radius: 16px; }
  .notice.say { justify-self: stretch; border-radius: 16px; white-space: pre-wrap; font: 13px/1.6 var(--mono); padding: 12px 16px; }
  @media (prefers-reduced-motion: reduce) { .glyph::before { animation: none !important; } }

  /* Composer */
  .bottom { padding: 6px 22px 22px; display: grid; gap: 8px; }
  .status { padding-left: 6px; color: var(--muted); font-size: 13.5px; min-height: 1.6em; }
  .busy .status { color: var(--accent); }
  .composer { display: flex; align-items: flex-end; gap: 10px; padding: 8px 8px 8px 22px; border-radius: 28px; background: var(--glass-strong); border: 1px solid var(--line); transition: border-color 0.2s; }
  .composer:focus-within { border-color: var(--accent); }
  .composer textarea { flex: 1; resize: none; border: 0; background: none; outline: none; padding: 8px 0; max-height: 180px; line-height: 1.5; }
  .composer textarea::placeholder { color: var(--muted); }
  .send { min-width: 42px; height: 42px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; flex: none; }
  .busy .send { background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 500; font-size: 14px; }

  @media (max-width: 600px) {
    .app { padding: 10px; }
    .lamp { border-radius: 28px; }
    .top { padding: 14px 14px 8px 18px; }
    .log { padding: 10px 18px 6px; }
    .bottom { padding: 6px 12px 14px; }
    .user { max-width: 92%; }
    .ask { margin-left: 0; }
    .where { display: none; }
  }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><canvas id="lava"></canvas></div>

<div class="app" id="app">
  <main class="lamp glass">
    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 15 20" aria-hidden="true"><path d="M7.5 0C7.5 0 0 8.2 0 12.7 0 16.7 3.4 20 7.5 20S15 16.7 15 12.7C15 8.2 7.5 0 7.5 0Z"/></svg>
        <span>MAK</span>
      </div>
      <span class="where" id="title"></span>
      <span class="push"></span><!--extra-->
      <button class="btn" id="open" aria-expanded="false" aria-controls="options">Opzioni</button>
    </header>

    <section class="options glass" id="options" aria-label="Opzioni" hidden>
      <div class="field">
        <span class="label">Come preferisci che lavori</span>
        <div class="seg" id="pace">
          <button type="button" data-effort="low">Veloce</button>
          <button type="button" data-effort="high">Equilibrato</button>
          <button type="button" data-effort="xhigh">Accurato</button>
        </div>
        <span class="hint" id="pacehint"></span>
      </div>
      <label class="switch">
        <input type="checkbox" id="yolo"><span class="track"></span>
        <span class="label">Fai da solo<small>Modifico i file ed eseguo i comandi senza chiederti prima il permesso.</small></span>
      </label>
      <div class="field" id="spendbox">
        <span class="label">Spesa di questa conversazione</span>
        <span class="spend" id="spend"></span>
      </div>
      <button class="btn" id="new" type="button">Ricomincia da capo</button>
      <details class="adv">
        <summary>Avanzate</summary>
        <div>
          <label class="field"><span class="hint">Modello</span>
            <input class="control" id="model" list="models" spellcheck="false" autocomplete="off">
            <datalist id="models"><option value="claude-opus-5-5"><option value="claude-sonnet-5-5"><option value="claude-haiku-5-5"><option value="claude-fable-5-2"></datalist>
          </label>
          <div class="field"><span class="hint">Cartella</span><span class="tokens" id="root"></span></div>
          <div class="field"><span class="hint">Consumo</span><span class="tokens" id="tokens"></span></div>
          <button class="btn" id="compact" type="button">Riassumi la conversazione</button>
        </div>
      </details>
    </section>

    <div class="log" id="log">
      <div class="thread" id="thread" aria-live="polite"></div>
    </div>

    <div class="bottom">
      <div class="status" id="status" role="status"></div>
      <form class="composer" id="form">
        <textarea id="input" rows="1" placeholder="Scrivi cosa ti serve…" aria-label="Messaggio"></textarea>
        <button class="send" id="send" aria-label="Invia">↑</button>
      </form>
    </div>
  </main>
</div>

<script nonce="__NONCE__">
(() => {
  const TOKEN = "__TOKEN__";
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  // Plain-language names for what the agent does: [while it happens, once done].
  const STEPS = {
    read_file: ["Leggo", "Ho letto"], write_file: ["Creo", "Ho creato"], edit_file: ["Modifico", "Ho modificato"],
    bash: ["Eseguo un comando", "Ho eseguito un comando"], glob: ["Cerco tra i file", "Ho cercato tra i file"],
    grep: ["Cerco nel codice", "Ho cercato nel codice"], task: ["Affido una ricerca a un aiutante", "L'aiutante ha finito"],
    web_search: ["Cerco sul web", "Ho cercato sul web"], web_fetch: ["Leggo una pagina web", "Ho letto una pagina web"],
  };
  const ON_FILE = new Set(["read_file", "write_file", "edit_file"]);
  const QUESTIONS = {
    write_file: (file) => "Posso creare " + file + "?",
    edit_file: (file) => "Posso modificare " + file + "?",
    bash: () => "Posso eseguire questo comando?",
  };
  const PACE = { low: "Veloce", medium: "Equilibrato", high: "Equilibrato", xhigh: "Accurato", max: "Accurato" };
  const PACE_HINT = {
    Veloce: "Risposte rapide, adatte a richieste semplici.",
    Equilibrato: "Un buon compromesso per quasi tutto.",
    Accurato: "Ci metto di più e controllo meglio. Costa un po' di più.",
  };

  const thread = $("thread"), log = $("log"), input = $("input"), app = $("app");
  const steps = new Map();
  let busy = false, answer = null, think = null, plan = null, asking = 0, lamp = () => {};

  const post = (path, body) =>
    fetch(path, { method: "POST", headers: { "content-type": "application/json", "x-mak-token": TOKEN }, body: JSON.stringify(body || {}) });
  const send = async (text, silent) => {
    const res = await post("/api/input", { text, silent: !!silent });
    if (res.status === 409) note("warn", "Sto ancora lavorando: aspetta che finisca oppure premi Ferma.");
    return res.ok;
  };

  const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 140;
  const follow = (fn) => { const stick = nearBottom(); const out = fn(); if (stick) log.scrollTop = log.scrollHeight; return out; };
  const add = (node) => follow(() => (thread.append(node), node));
  const note = (level, text) => add(el("div", "notice " + level, text));

  // Minimal Markdown: fenced code, inline code and bold. Everything is escaped first.
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = (s) => esc(s).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  const markdown = (src) => {
    const parts = src.split("```");
    return parts.map((part, i) => {
      // Blank lines next to a code block would double its margins.
      if (i % 2 === 0) return inline(part.replace(i ? /^\n+/ : /^$/, "").replace(i < parts.length - 1 ? /\n+$/ : /^$/, ""));
      return '<pre class="code"><code>' + esc(part.replace(/^[^\n]*\n?/, "").replace(/\n$/, "")) + "</code></pre>";
    }).join("");
  };

  function welcome() {
    const box = el("div", "welcome");
    box.append(el("h2", "", "Ciao. Cosa facciamo oggi?"), el("p", "", "Dimmelo con parole tue. Prima di cambiare qualcosa ti chiedo sempre il permesso."));
    const ideas = el("div", "ideas");
    for (const text of ["Spiegami cosa fa questo progetto", "C'è un errore, aiutami a trovarlo", "Aggiungi una nuova funzione"]) {
      const b = el("button", "", text);
      b.type = "button";
      b.addEventListener("click", () => { input.value = text; grow(); input.focus(); });
      ideas.append(b);
    }
    box.append(ideas);
    thread.append(box);
  }
  const clearWelcome = () => thread.querySelector(".welcome")?.remove();

  function showStatus() {
    $("status").textContent = asking ? "Aspetto la tua risposta qui sopra." : busy ? "Sto lavorando…" : "";
    lamp(asking ? 0.05 : busy ? 1 : 0.3);
  }

  function changeBlock(detail) {
    const block = el("pre", "change");
    for (const line of detail.split("\n")) {
      const text = line.replace(/^ {4}/, "");
      const gone = text.startsWith("-");
      block.append(el("span", gone ? "del" : "add", (gone ? "− " : "+ ") + text.replace(/^[-+] {0,3}/, "")));
    }
    return block;
  }

  function label(step, done) {
    const words = STEPS[step.name] || [step.name, step.name];
    const node = step.node.querySelector(".label");
    node.replaceChildren(document.createTextNode(words[done ? 1 : 0]));
    if (ON_FILE.has(step.name)) node.append(" ", el("b", "", step.target));
    else if (step.name === "web_search") node.append(": ", el("b", "", step.target));
  }

  function toolStart(e) {
    answer = think = null;
    if (e.todos) {
      if (!plan || !plan.isConnected) plan = add(el("div", "plan"));
      follow(() => plan.replaceChildren(...e.todos.map((t) => el("span", t.status, t.content))));
      return;
    }
    const node = el("div", "step running" + (e.sub ? " sub" : ""));
    const line = el("div", "line");
    line.append(el("span", "glyph"), el("span", "label"));
    node.append(line);
    const step = { node, name: e.name, target: e.summary.replace(/ \(\d+ righe\)$/, ""), summary: e.summary, detail: e.detail };
    steps.set(e.id, step);
    label(step, false);
    add(node);
  }

  function toolEnd(e) {
    const step = steps.get(e.id);
    if (!step) return;
    follow(() => {
      const { node } = step;
      if (node.querySelector(".ask")) { node.querySelector(".ask").remove(); asking = Math.max(0, asking - 1); showStatus(); }
      node.classList.remove("running");
      if (e.status === "denied") {
        node.classList.add("denied");
        node.querySelector(".label").textContent = "Non l'ho fatto, come hai chiesto.";
        return;
      }
      node.classList.add(e.status === "error" ? "error" : "done");
      if (e.status === "error") node.querySelector(".label").textContent = "Non ci sono riuscito: " + (e.output.split("\n")[0] || "errore");
      else label(step, true);
      if (e.server) return;
      const more = el("details");
      more.append(el("summary", "", "Dettagli"));
      if (step.name === "bash") more.append(el("pre", "raw", step.summary));
      if (step.detail) more.append(changeBlock(step.detail));
      if (e.output.trim() && !(step.detail && e.status === "ok")) more.append(el("pre", "raw", e.output.trimEnd()));
      if (more.children.length > 1) node.append(more);
    });
  }

  function approval(e) {
    const step = steps.get(e.id);
    if (!step || step.node.querySelector(".ask")) return;
    const box = el("div", "ask");
    box.append(el("h3", "", (QUESTIONS[step.name] || (() => "Posso procedere?"))(step.target)));
    if (step.detail) box.append(changeBlock(step.detail));
    else if (step.name === "bash") box.append(el("pre", "raw", step.summary));
    const row = el("div", "row");
    const choose = (value) => () => { box.querySelectorAll("button").forEach((b) => (b.disabled = true)); post("/api/approve", { id: e.id, answer: value }); };
    const yes = el("button", "btn primary", "Sì, procedi"), no = el("button", "btn", "No");
    const always = el("button", "link", "Sì, e non chiedermelo più per azioni così");
    for (const [b, v] of [[yes, "yes"], [no, "no"], [always, "always"]]) { b.type = "button"; b.addEventListener("click", choose(v)); }
    row.append(yes, no);
    box.append(row, always);
    asking++;
    follow(() => step.node.append(box));
    showStatus();
    yes.focus({ preventScroll: true });
  }

  function setBusy(value) {
    busy = value;
    if (!busy) asking = 0;
    app.classList.toggle("busy", busy);
    $("send").textContent = busy ? "Ferma" : "↑";
    $("send").setAttribute("aria-label", busy ? "Ferma" : "Invia");
    showStatus();
  }

  const handlers = {
    reset() { thread.replaceChildren(); steps.clear(); answer = think = plan = null; asking = 0; welcome(); },
    user(e) { clearWelcome(); answer = think = plan = null; add(el("div", "msg user", e.text)); log.scrollTop = log.scrollHeight; },
    thinking(e) {
      if (!think) {
        const box = el("details", "think");
        box.append(el("summary", "", "Ci sto ragionando"), (think = el("div", "")));
        add(box); answer = null;
      }
      follow(() => (think.textContent += e.delta));
    },
    text(e) {
      clearWelcome();
      if (!answer) { answer = add(el("div", "msg answer")); answer.raw = ""; think = null; }
      follow(() => { answer.raw += e.delta; answer.innerHTML = markdown(answer.raw); });
    },
    message_end() { answer = think = null; },
    tool_start(e) { clearWelcome(); toolStart(e); },
    tool_end: toolEnd,
    approval,
    approval_done() {},
    notice(e) { clearWelcome(); answer = think = null; note(e.level, e.text.trim()); },
    state(e) {
      $("title").textContent = e.root.split(/[\\/]/).filter(Boolean).pop() || "";
      $("root").textContent = e.root;
      if (document.activeElement !== $("model")) $("model").value = e.model;
      const pace = PACE[e.effort] || "Equilibrato";
      for (const b of $("pace").children) b.setAttribute("aria-pressed", String(b.textContent === pace));
      $("pacehint").textContent = PACE_HINT[pace];
      $("yolo").checked = e.yolo;
      const price = e.cost.match(/\$([\d.]+)/);
      $("spendbox").hidden = !price;
      if (price) $("spend").textContent = Number(price[1]).toLocaleString("it-IT", { style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: 2 });
      $("tokens").textContent = e.cost.split("\n")[0].replace("Token: ", "").replace(/ · /g, "\n");
      setBusy(e.busy);
    },
  };

  const source = new EventSource("/events?t=" + TOKEN);
  source.onmessage = (m) => { const e = JSON.parse(m.data); handlers[e.type]?.(e); };
  source.onerror = () => { $("status").textContent = "Collegamento perso: controlla che MAK sia ancora aperto nel terminale."; };

  const grow = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; };
  input.addEventListener("input", grow);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
  });
  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (busy) return void post("/api/interrupt");
    const text = input.value.trim();
    if (!text) return;
    input.value = ""; grow();
    if (!(await send(text))) { input.value = text; grow(); }
  });

  const options = $("options");
  const toggleOptions = (show) => { options.hidden = !show; $("open").setAttribute("aria-expanded", String(show)); };
  $("open").addEventListener("click", (e) => { e.stopPropagation(); toggleOptions(options.hidden); });
  document.addEventListener("click", (e) => { if (!options.hidden && !options.contains(e.target)) toggleOptions(false); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !options.hidden) { toggleOptions(false); $("open").focus(); } });
  $("pace").addEventListener("click", (e) => e.target.dataset.effort && send("/effort " + e.target.dataset.effort, true));
  $("model").addEventListener("change", (e) => e.target.value.trim() && send("/model " + e.target.value.trim(), true));
  $("yolo").addEventListener("change", (e) => send("/yolo " + (e.target.checked ? "on" : "off"), true));
  $("new").addEventListener("click", () => { toggleOptions(false); send("/clear", true); });
  $("compact").addEventListener("click", () => { toggleOptions(false); send("/compact", true); });

  // Lava lamp: a metaball field on a small canvas. Wax rises warm from the pool at the
  // bottom, cools as it climbs, and sinks back. How fast it moves follows the agent.
  (() => {
    const canvas = $("lava"), ctx = canvas.getContext("2d");
    const still = matchMedia("(prefers-reduced-motion: reduce)");
    const rand = (a, b) => a + Math.random() * (b - a);
    const drops = Array.from({ length: 9 }, (_, i) => ({
      x: (i + 0.5) / 9 + rand(-0.04, 0.04), r: rand(0.075, 0.13), period: rand(70, 150), phase: Math.random(), sway: rand(0, 6.28),
    }));
    const pools = [[0.1, 1.12, 0.2], [0.36, 1.16, 0.24], [0.62, 1.13, 0.22], [0.88, 1.15, 0.23], [0.28, -0.14, 0.17], [0.72, -0.16, 0.19]];
    let w = 0, h = 0, image = null, hot = [0, 0, 0], cool = [0, 0, 0], last = 0, clock = Math.random() * 500, heat = 0.3, target = 0.3;
    lamp = (value) => { target = value; canvas.style.opacity = `calc(var(--lava-opacity) * ${(0.85 + 0.45 * value).toFixed(2)})`; };

    const readTheme = () => {
      const css = getComputedStyle(document.documentElement);
      hot = css.getPropertyValue("--lava-hot").trim().split(/\s+/).map(Number);
      cool = css.getPropertyValue("--lava-cool").trim().split(/\s+/).map(Number);
    };
    const resize = () => {
      const scale = Math.max(6, Math.ceil(innerWidth / 170));
      w = canvas.width = Math.max(40, Math.ceil(innerWidth / scale));
      h = canvas.height = Math.max(40, Math.ceil(innerHeight / scale));
      image = ctx.createImageData(w, h);
    };
    const draw = (seconds) => {
      const unit = Math.min(w, h), ratio = w / h, balls = [];
      for (const d of drops) {
        const turn = (seconds / d.period + d.phase) * 6.2832;
        balls.push([(d.x + 0.05 * Math.sin(seconds / 23 + d.sway)) * w, (0.5 + 0.66 * Math.sin(turn)) * h, d.r * unit]);
      }
      for (const [x, y, r] of pools) balls.push([x * w, y * h + Math.sin(seconds / 31 + x * 9) * 0.02 * h, r * unit * Math.max(1, ratio * 0.55)]);
      const data = image.data;
      for (let py = 0, i = 0; py < h; py++) {
        const warm = py / h, red = cool[0] + (hot[0] - cool[0]) * warm, green = cool[1] + (hot[1] - cool[1]) * warm, blue = cool[2] + (hot[2] - cool[2]) * warm;
        for (let px = 0; px < w; px++, i += 4) {
          let field = 0;
          for (let b = 0; b < balls.length; b++) {
            const dx = px - balls[b][0], dy = py - balls[b][1];
            const near = (balls[b][2] * balls[b][2]) / (dx * dx + dy * dy + 0.01);
            field += near * near; // steep falloff keeps separate drops separate until they touch
          }
          const edge = field < 0.8 ? 0 : field > 1.25 ? 1 : (field - 0.8) / 0.45;
          data[i] = red; data[i + 1] = green; data[i + 2] = blue;
          data[i + 3] = 255 * edge * edge * (3 - 2 * edge);
        }
      }
      ctx.putImageData(image, 0, 0);
    };
    const frame = (now) => {
      const dt = Math.min(0.1, (now - last) / 1000);
      if (document.hidden) last = now;
      else if (dt >= 0.04) {
        last = now;
        heat += (target - heat) * Math.min(1, dt * 0.8); // warms up and cools down gradually
        clock += dt * (0.4 + 5 * heat);
        draw(clock);
      }
      if (!still.matches) requestAnimationFrame(frame);
    };
    const restart = () => { readTheme(); resize(); draw(clock); };
    addEventListener("resize", restart);
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", restart);
    new MutationObserver(restart).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    still.addEventListener("change", () => !still.matches && requestAnimationFrame(frame));
    restart();
    if (!still.matches) requestAnimationFrame(frame);
  })();

  welcome();
  input.focus();
})();
</script>
</body>
</html>
